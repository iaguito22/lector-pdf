name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri Windows (.exe)
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri Linux (.deb and .AppImage)
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Arch Linux (.pkg.tar.zst) and organize assets
        run: |
          mkdir -p release-final arch-content
          DEB_FILE=$(find release-artifacts -type f -name "*.deb" | head -n 1)
          if [ -n "$DEB_FILE" ] && [ -f "$DEB_FILE" ]; then
            cd arch-content
            ar x "$OLDPWD/$DEB_FILE"
            tar -xf data.tar.*
            cat > .PKGINFO <<EOF
          pkgname = lector-pdf
          pkgver = 1.0.0-1
          pkgdesc = Lector de PDF minimalista con barra magnética adaptativa
          url = https://github.com/iaguito22/lector-pdf
          builddate = $(date +%s)
          packager = Iago <igl2005@hotmail.com>
          size = $(du -sb usr | awk '{print $1}')
          arch = x86_64
          license = MIT
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = cairo
          depend = gdk-pixbuf2
          depend = glib2
          EOF
            cat > .BUILDINFO <<EOF
          format = 2
          pkgname = lector-pdf
          pkgver = 1.0.0-1
          pkgarch = x86_64
          EOF
            tar --zstd -cf "$OLDPWD/release-final/lector-pdf-1.0.0-1-x86_64.pkg.tar.zst" .PKGINFO .BUILDINFO usr
            cd "$OLDPWD"
          fi
          find release-artifacts -type f \( -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release-final/ \;
          cp PKGBUILD release-final/PKGBUILD

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-final/*
          name: "Lector PDF ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
