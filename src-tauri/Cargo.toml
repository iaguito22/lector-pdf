[package]
name = "lector-pdf"
version = "1.0.0"
description = "Lector de PDF adaptativo e innovador con barra magnética"
authors = ["Iago"]
edition = "2021"

[lib]
name = "lector_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
